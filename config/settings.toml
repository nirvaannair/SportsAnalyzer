# SportsAnalyzer settings: every tunable value lives here, not in the code.
#
# * Edit this file, or change values on the dashboard's Settings page (those changes are saved to
#   config/settings.local.json, which overrides this file and is not committed).
# * Most values apply at once. Leagues and providers apply after a restart (Stop, then Start).
# * Money limits and API keys stay in .env (secret / personal).
# * What stays in code on purpose: names (database columns, feature names, status words such as
#   "finished"), the three markets (1X2, Over/Under 2.5, BTTS) and pure maths constants.

[app]
user_agent = "SportsAnalyzer/0.1 (personal research tool)"

# Data sources listed on the Overview / Data sources pages, and the .env variable holding each key.
data_sources = [
  { name = "fdcuk", label = "football-data.co.uk", key_env = "" },
  { name = "api_football", label = "API-Football", key_env = "API_FOOTBALL_API_KEY" },
  { name = "football_data", label = "football-data.org", key_env = "FOOTBALL_DATA_API_KEY" },
  { name = "thesportsdb", label = "TheSportsDB", key_env = "THESPORTSDB_API_KEY" },
  { name = "odds_api", label = "The Odds API", key_env = "ODDS_API_KEY" },
  { name = "stake", label = "Stake", key_env = "STAKE_ACCESS_TOKEN" },
]

