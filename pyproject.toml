[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsanalyzer"
version = "0.1.0"
description = "Local football analytics, ML pricing and bet tracking."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.1",
    "aiohttp>=3.11",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "tzdata>=2025.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "scrapy>=2.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs the Docker Postgres database running (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B027: ProviderAdapter.initialize/close are intentionally optional no-op hooks.
ignore = ["E501", "B027"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
