[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

# The actual database URL is loaded from SportsAnalyzer's .env file
# by the Alembic environment script. This value is intentionally
# non-functional and must not contain credentials.
sqlalchemy.url =

[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S